name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint & Mutation Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Lint & Typecheck codebase (npm run lint)
        run: npm run lint

      - name: Run unit & architecture tests (Vitest)
        run: npm test

      - name: Run mutation testing (Stryker)
        run: npm run test:mutation

      - name: Build production bundle (Vite)
        run: npm run build
